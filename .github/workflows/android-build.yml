name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: 5. Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 6. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: 6.1 Patch Expo Autolinking Inline Module Paths
        working-directory: ./frontend
        run: |
          python - <<'PY'
          from pathlib import Path

          candidate_paths = [
              Path("node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-plugin/src/main/kotlin/expo/modules/plugin/ExpoAutolinkingPlugin.kt"),
              Path("node_modules/expo/node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-plugin/src/main/kotlin/expo/modules/plugin/ExpoAutolinkingPlugin.kt"),
          ]

          old_block = (
              '    val srcDir = project.file("src/main/java/inline/modules/").absolutePath\n'
              '    val buildDir = project.file("build/inline/modules/").absolutePath\n'
          )
          new_block = (
              '    val moduleDir = project.file("android").takeIf { it.exists() } ?: project.projectDir\n'
              '    val srcDir = File(moduleDir, "src/main/java/inline/modules/").absolutePath\n'
              '    val buildDir = File(moduleDir, "build/inline/modules/").absolutePath\n'
          )

          patched_any = False
          for file_path in candidate_paths:
              if not file_path.exists():
                  continue
              source = file_path.read_text()
              if "import java.io.File" not in source:
                  source = source.replace("import java.nio.file.Paths", "import java.io.File\nimport java.nio.file.Paths")
              if old_block in source:
                  source = source.replace(old_block, new_block)
              file_path.write_text(source)
              patched_any = True

          if not patched_any:
              raise SystemExit("ExpoAutolinkingPlugin.kt not found in expected node_modules paths")
          PY

      - name: 7. Generate Native Android Project
        working-directory: ./frontend
        run: npx expo prebuild -p android --clean --no-install

      - name: 8. Accept Android Licenses & Setup NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          for attempt in 1 2 3; do
            sdkmanager "ndk;27.1.12297006" && break || echo "Retrying NDK install ($attempt/3)..."
            sleep 5
          done

      - name: 9. Configure Gradle Memory & Build Settings
        working-directory: ./frontend
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties

      - name: 10. Build Android APK (${{ inputs.build_type || 'release' }})
        working-directory: ./frontend/android
        env:
          NODE_OPTIONS: --max_old_space_size=6144
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: 11. Rename & Organize APK
        working-directory: ./frontend/android
        run: |
          mkdir -p ../../dist-apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../../dist-apk/StudyQuest-JUET.apk \;
          ls -lh ../../dist-apk/

      - name: 12. Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyQuest-JUET-APK
          path: dist-apk/StudyQuest-JUET.apk
          if-no-files-found: error
          retention-days: 14

      - name: 13. Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/StudyQuest-JUET.apk
          tag_name: "v1.0.${{ github.run_number }}"
          name: "StudyQuest JUET APK v1.0.${{ github.run_number }}"
          body: |
            ### 🎓 StudyQuest — JUET Attendance Tracker & Bunk Calculator
            
            **Automated Build #${{ github.run_number }}**
            - **Commit:** `${{ github.sha }}`
            - **Official JUET Odd Sem 2026 Academic Calendar rules applied**
            - **Modern sleek minimalist UI with fluid GSAP-style physics**
            - **Dedicated Per-Subject Bunk & Criteria Calculators**
            
            **Direct Download:** Download `StudyQuest-JUET.apk` below and install directly on your Android phone.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
